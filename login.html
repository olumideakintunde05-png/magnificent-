<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Log In | Shortlet Magnificent</title>
<meta name="description" content="Log in or create a Shortlet Magnificent account to save stays and manage your bookings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="desktop.css">
<link rel="stylesheet" href="login.css">
<script src="error-handler.js"></script>
<script src="skeleton-loader.js"></script>
<script src="load-guard.js"></script>
</head>
<body class="auth-body">

<div class="auth-screen">
  <div class="auth-card">

    <!-- ============ BRAND PANEL ============ -->
    <div class="auth-brand">
      <button type="button" class="auth-close" id="authClose" aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>

      <div class="auth-brand-body">
        <div class="auth-logo">
          <span class="auth-mark"><img src="images/logo-icon.png?v=2" alt="Shortlet Magnificent"></span>
          <p class="auth-eyebrow">SHORTLET<br>MAGNIFICENT</p>
        </div>
        <h1 id="authHeadline">Welcome back</h1>
        <p id="authSubline">Sign in to manage your saved stays and bookings.</p>
      </div>

      <!-- Arch motif, echoing the brand mark's arch/house symbolism -->
      <div class="auth-arch" aria-hidden="true">
        <svg viewBox="0 0 220 220" fill="none">
          <path d="M10 210 V110 C10 65 50 30 110 30 C170 30 210 65 210 110 V210" stroke="#f0c48d" stroke-width="1.4" opacity="0.35"/>
          <path d="M46 210 V120 C46 88 74 64 110 64 C146 64 174 88 174 120 V210" stroke="#f0c48d" stroke-width="1.4" opacity="0.5"/>
        </svg>
      </div>
    </div>

    <!-- ============ FORM SHEET ============ -->
    <div class="auth-sheet">

      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" id="tabLogin" role="tab" aria-selected="true">Log In</button>
        <button type="button" class="auth-tab" id="tabSignup" role="tab" aria-selected="false">Create Account</button>
      </div>

      <div class="auth-panels">

        <!-- ---------- LOG IN ---------- -->
        <form class="auth-panel active" id="loginPanel" novalidate>
          <div class="auth-error" id="loginError"></div>
          <div class="auth-note" id="loginNote"></div>

          <div class="auth-field">
            <label for="loginEmail">Email address</label>
            <div class="auth-input-wrap">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 6H20V18H4V6Z" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 6L12 13L20 6" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round"/></svg>
              <input type="email" id="loginEmail" name="email" placeholder="you@example.com" autocomplete="email" required>
            </div>
          </div>

          <div class="auth-field">
            <label for="loginPassword">Password</label>
            <div class="auth-input-wrap">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="10" rx="2" stroke="#9AA3B2" stroke-width="1.6"/><path d="M8 10V7C8 4.8 9.8 3 12 3C14.2 3 16 4.8 16 7V10" stroke="#9AA3B2" stroke-width="1.6"/></svg>
              <input type="password" id="loginPassword" name="password" placeholder="••••••••" autocomplete="current-password" required minlength="6">
              <button type="button" class="auth-toggle-pw" data-target="loginPassword" aria-label="Show password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M2 12C2 12 6 5 12 5C18 5 22 12 22 12C22 12 18 19 12 19C6 19 2 12 2 12Z" stroke="#9AA3B2" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="#9AA3B2" stroke-width="1.6"/></svg>
              </button>
            </div>
            <a href="#" class="auth-forgot" id="forgotLink">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-gold btn-full auth-submit" id="loginSubmit">
            <span class="btn-spinner"></span>
            <span class="btn-label">Log In</span>
          </button>
        </form>

        <!-- ---------- SIGN UP ---------- -->
        <form class="auth-panel" id="signupPanel" novalidate>
          <div class="auth-error" id="signupError"></div>
          <div class="auth-note" id="signupNote"></div>

          <div class="auth-field">
            <label for="signupName">Full name</label>
            <div class="auth-input-wrap">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.2" stroke="#9AA3B2" stroke-width="1.6"/><path d="M5 20C5 16.5 8 14 12 14C16 14 19 16.5 19 20" stroke="#9AA3B2" stroke-width="1.6" stroke-linecap="round"/></svg>
              <input type="text" id="signupName" name="name" placeholder="e.g. Chioma Eze" autocomplete="name" required>
            </div>
          </div>

          <div class="auth-field">
            <label for="signupEmail">Email address</label>
            <div class="auth-input-wrap">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 6H20V18H4V6Z" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 6L12 13L20 6" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round"/></svg>
              <input type="email" id="signupEmail" name="email" placeholder="you@example.com" autocomplete="email" required>
            </div>
          </div>

          <div class="auth-field">
            <label for="signupPassword">Password</label>
            <div class="auth-input-wrap">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="10" rx="2" stroke="#9AA3B2" stroke-width="1.6"/><path d="M8 10V7C8 4.8 9.8 3 12 3C14.2 3 16 4.8 16 7V10" stroke="#9AA3B2" stroke-width="1.6"/></svg>
              <input type="password" id="signupPassword" name="password" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8">
              <button type="button" class="auth-toggle-pw" data-target="signupPassword" aria-label="Show password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M2 12C2 12 6 5 12 5C18 5 22 12 22 12C22 12 18 19 12 19C6 19 2 12 2 12Z" stroke="#9AA3B2" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="#9AA3B2" stroke-width="1.6"/></svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-gold btn-full auth-submit" id="signupSubmit">
            <span class="btn-spinner"></span>
            <span class="btn-label">Create Account</span>
          </button>
        </form>

      </div>

      <div class="auth-divider">or</div>
      <a href="index.html" class="btn btn-outline btn-full auth-guest-btn" id="guestLink">Continue as Guest</a>

      <p class="auth-switch" id="authSwitchLine">
        New to Shortlet Magnificent? <button type="button" id="switchToSignup">Create an account</button>
      </p>

    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script src="login.js"></script>
<script src="desktop-enhance.js"></script>
</body>
</html>
