[build]
  publish = "."

# Safe-by-default browser headers for every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Keep the admin panel out of Google.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# If the pictures were uploaded loose (without the images folder), /images/xyz.jpg
# still works. A real file in /images/ always wins; this only fills the gap.
[[redirects]]
  from = "/images/*"
  to = "/:splat"
  status = 200
